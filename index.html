<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6fb" />
  <title>Games Fax Hub — 140+ Browser Games</title>
  <meta name="description" content="A curated collection of 140+ playable HTML/Phaser/Three.js browser games. Click and play instantly." />
  <meta property="og:title" content="Games Fax Hub — 140+ Browser Games" />
  <meta property="og:description" content="Click and play 140+ HTML5 games in your browser. Built with Phaser & Three.js." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="site/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <div class="hero__top">
        <a class="brand" href="#">
          <span class="brand__logo" aria-hidden="true">🎮</span>
          <span class="brand__text" data-i18n="brand.name"></span>
        </a>
        <div class="hero__actions">
          <button id="fax-settings-toggle" class="btn-icon" type="button" aria-label="تنظیمات" title="تنظیمات">⚙️</button>
          <button id="page-fullscreen-toggle" class="btn-icon" type="button" aria-label="تمام‌صفحه" title="تمام‌صفحه" aria-pressed="false">⛶</button>
          <a id="about-link" class="btn-icon" href="about.html" aria-label="درباره ما" title="درباره ما">ⓘ</a>
          <button id="theme-toggle" class="btn-icon" type="button" data-i18n-aria-label="aria.toggleTheme">
            <span class="theme-icon">☀️</span>
          </button>
        </div>
      </div>

      <h1 class="hero__title">
        <span class="grad" data-i18n="hero.titleLine1"></span>
        <br /><span data-i18n="hero.titleLine2"></span>
      </h1>
      <p class="hero__sub" data-i18n="hero.subtitle"></p>

      <div class="hero__cta">
        <button class="btn-primary" id="random-game" type="button">
          <span>🎲</span> <span data-i18n="cta.playRandom"></span>
        </button>
        <a class="btn-ghost" href="#games" data-i18n="cta.browseAll"></a>
      </div>

      <div class="stats" id="stats" aria-hidden="true">
        <!-- filled by JS: total + per-category counts -->
      </div>
    </div>
  </header>

  <main>
    <section class="controls" data-i18n-aria-label="aria.filterGames">
      <div class="controls__inner">
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m20 20-4.35-4.35M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"/></svg>
          <input type="search" id="search-input" data-i18n-placeholder="search.placeholder" autocomplete="off" />
          <kbd class="search__kbd">/</kbd>
        </label>

        <nav class="filters" id="filters" data-i18n-aria-label="aria.categories">
          <!-- filled by JS -->
        </nav>
      </div>
    </section>

    <section class="fax-dashboard" id="fax-dashboard">
      <div class="fax-dashboard__inner">
        <section class="fax-shelf" id="recent-shelf" hidden><h2 id="recent-title">🕘 اخیراً بازی‌شده</h2><div class="fax-mini-grid" id="recent-grid"></div></section>
        <section class="fax-shelf" id="popular-shelf" hidden><h2 id="popular-title">🔥 محبوب‌ترین‌ها روی این دستگاه</h2><div class="fax-mini-grid" id="popular-grid"></div></section>
      </div>
    </section>

    <section class="games" id="games" aria-live="polite">
      <div class="games__inner">
        <div class="games__grid" id="grid"></div>
        <p class="games__empty" id="empty" hidden>
          <span data-i18n="empty.noMatches"></span> <button class="link" id="clear-filters" type="button" data-i18n="empty.clearFilters"></button>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <p>
        <span data-i18n="footer.builtBy"></span> Amir
        · <span data-i18n="footer.collection"></span>
      </p>
      <p class="footer__hint">
        <label for="language-select" data-i18n="footer.language"></label>
        <select id="language-select">
          <option value="fa" data-i18n="language.persian"></option>
          <option value="en" data-i18n="language.english"></option>
        </select>
      </p>
      <p class="footer__hint"><span data-i18n="footer.press"></span> <kbd>/</kbd> <span data-i18n="footer.toSearch"></span> · <kbd>Esc</kbd> <span data-i18n="footer.toClose"></span> · <kbd>R</kbd> <span data-i18n="footer.forRandom"></span></p>
    </div>
  </footer>

  <!-- Modal player -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <header class="modal__bar">
        <div class="modal__meta">
          <span class="modal__chip" id="modal-chip"></span>
          <h2 id="modal-title" class="modal__title" data-i18n="modal.defaultTitle"></h2>
        </div>
        <div class="modal__tools">
          <button class="btn-icon" id="modal-fullscreen" type="button" data-i18n-aria-label="aria.toggleFullscreen" data-i18n-title="title.fullscreen">⛶</button>
          <button class="btn-icon" id="modal-reload" type="button" data-i18n-aria-label="aria.restartGame" data-i18n-title="title.restart">↻</button>
          <a class="btn-icon" id="modal-open" target="_blank" rel="noopener" data-i18n-aria-label="aria.openInNewTab" data-i18n-title="title.openInNewTab">↗</a>
          <button class="btn-icon btn-icon--danger" id="modal-close" type="button" data-i18n-aria-label="aria.close" data-close data-i18n-title="title.close">✕</button>
        </div>
      </header>
      <div class="modal__game-actions"><button class="btn-ghost" id="modal-back" type="button">← بازگشت</button><button class="btn-ghost" id="modal-info" type="button">ⓘ اطلاعات</button></div>
      <div class="modal__frame-wrap">
        <iframe id="modal-frame" class="modal__frame" data-i18n-title="title.game" allow="autoplay; fullscreen; gamepad" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals allow-popups allow-forms"></iframe>
      </div>
    </div>
  </div>

  <script src="site/app.js" defer></script>

  <div id="fax-settings" class="fax-settings" hidden>
    <div class="fax-settings__backdrop" data-fax-close></div>
    <section class="fax-settings__panel" role="dialog" aria-modal="true">
      <header class="fax-settings__header">
        <h2 id="fax-settings-title">تنظیمات</h2>
        <button class="btn-icon btn-icon--danger" type="button" data-fax-close>✕</button>
      </header>
      <div class="fax-settings__section">
        <h3 id="fax-language-title">🌐 زبان</h3>
        <div class="fax-row">
          <button type="button" class="fax-choice" data-fax-lang="fa">🇮🇷 فارسی</button>
          <button type="button" class="fax-choice" data-fax-lang="en">🇬🇧 English</button>
        </div>
      </div>
      <div class="fax-settings__section">
        <h3 id="fax-data-title">💾 اطلاعات و نصب</h3>
        <div class="fax-row"><button id="fax-install" class="btn-primary" type="button">📱 نصب Games Fax Hub</button><button id="fax-export" class="btn-ghost" type="button">خروجی تنظیمات</button><button id="fax-import" class="btn-ghost" type="button">ورود تنظیمات</button><input id="fax-import-file" type="file" accept="application/json" hidden></div>
      </div>
      <div class="fax-settings__section">
        <h3 id="fax-theme-title">🎨 تم</h3>
        <div id="fax-theme-grid" class="fax-theme-grid"></div>
        <details class="fax-custom">
          <summary id="fax-custom-title">ساخت تم اختصاصی</summary>
          <div class="fax-colors">
            <label>پس‌زمینه <input type="color" data-fax-color="bg" value="#f5f6fb"></label>
            <label>کارت <input type="color" data-fax-color="card" value="#ffffff"></label>
            <label>رنگ اصلی <input type="color" data-fax-color="accent" value="#7c87ff"></label>
            <label>متن <input type="color" data-fax-color="text" value="#171827"></label>
          </div>
          <div class="fax-row">
            <button id="fax-apply-custom" class="btn-primary" type="button">اعمال</button>
            <button id="fax-reset-theme" class="btn-ghost" type="button">پیش‌فرض</button>
          </div>
        </details>
      </div>
    </section>
  </div>

  <div class="fax-info-modal" id="game-info" hidden><div class="fax-info-backdrop" data-info-close></div><section class="fax-info-panel"><button class="btn-icon btn-icon--danger fax-info-close" data-info-close>✕</button><div id="game-info-content"></div><div class="fax-row"><button class="btn-primary" id="info-play">▶ بازی</button><button class="btn-ghost" id="info-share">🔗 اشتراک‌گذاری</button></div></section></div>
</body>
</html>
